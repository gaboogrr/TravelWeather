# Puerto: Render lo asigna con la variable PORT
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Conexion a PostgreSQL. En tu PC usa los valores por defecto.
# En Render se configuran con variables de entorno:
#   DB_URL, DB_USER, DB_PASSWORD
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travelweather}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

